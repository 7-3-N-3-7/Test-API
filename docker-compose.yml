version: '3.8'

services:
  # 1. PostgreSQL Database for Keycloak
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    networks:
      - app-network

  # 2. Keycloak Runtime
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      
      # --- ADD THESE 5 LINES ---
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: "http://localhost:8080"
      KC_HOSTNAME_ADMIN_URL: "http://localhost:8080"
      
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db
    networks:
      - app-network

  # 3. PostgreSQL Database for Business Data
  business-db:
    image: postgres:15
    container_name: business-db
    environment:
      POSTGRES_DB: business_data
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432" # Mapped to 5433 to avoid conflict with Keycloak DB
    networks:
      - app-network

  # 4. Core (Java) RESTful Backend
  core-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://business-db:5432/business_data
      - SPRING_DATASOURCE_USERNAME=myapp
      - SPRING_DATASOURCE_PASSWORD=mypassword
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://keycloak:8080/realms/myrealm
    ports:
      - "8081:8081"
    depends_on:
      - business-db
      - keycloak
    networks:
      - app-network

  # 5. Cucumber E2E Test Suite
  cucumber-tests:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: cucumber-tests
    # Only run the tests after the backend is up
    depends_on:
      - core-backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge