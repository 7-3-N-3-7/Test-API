server:
  port: 8081

spring:
  application:
    name: myapp
  security:
    oauth2:
      resourceserver:
        jwt:
          # This allows it to work inside Docker AND on your local machine
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8080/realms/myrealm}
          
  # Add this new section for the PostgreSQL database connection!
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/business_data}
    username: ${SPRING_DATASOURCE_USERNAME:myapp}
    password: ${SPRING_DATASOURCE_PASSWORD:mypassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect